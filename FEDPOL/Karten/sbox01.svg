         x="51.734375"
         y="161.30758"
         id="tspan1">• Elektroshock-Gitter nicht im Boden, sondern EMF in der </tspan><tspan
         x="51.734375"
         y="171.97428"
         id="tspan5">Decke
</tspan><tspan
         x="51.734375"
         y="182.64098"
         id="tspan6">
</tspan><tspan
         x="51.734375"
         y="193.30768"
         id="tspan7">• Use Case auch nur zur Einschüchterung von Zeugen, zB </tspan><tspan
         x="51.734375"
         y="203.97438"
         id="tspan8">dem FEDPOL Meldung zu erstatten
</tspan><tspan
         x="51.734375"
         y="214.64109"
         id="tspan9">
</tspan><tspan
         x="51.734375"
         y="225.30779"
         id="tspan10">• Gepaart mit anderen Konzepten wie dem Little Albert </tspan><tspan
         x="51.734375"
         y="235.97449"
         id="tspan11">Experiment (EMF um zB ICD10 G40.2 </tspan><tspan
         x="51.734375"
         y="246.64119"
         id="tspan13">auszulösen+Lautsprecher)
</tspan><tspan
         x="51.734375"
         y="257.3079"
         id="tspan14"> 
</tspan><tspan
         x="51.734375"
         y="267.9746"
         id="tspan15">•  Decke ganze Wohnungsfläche
</tspan><tspan
         x="51.734375"
         y="278.64128"
         id="tspan16">
</tspan><tspan
         x="51.734375"
         y="289.30797"
         id="tspan17">•  Bei einer anderen Mieterin in der Neuenburgerstrasse 6 </tspan><tspan
         x="51.734375"
         y="299.97466"
         id="tspan18">kann damit mutmasslich Ashtma ausgelöst werden
</tspan><tspan
         x="51.734375"
         y="310.64135"
         id="tspan19">
</tspan><tspan
         x="51.734375"
         y="321.30803"
         id="tspan24">•  Mutmasslich auch zusätzliches Blackhat Gear </tspan><tspan
         x="51.734375"
         y="331.97472"
         id="tspan25">einbetoniert wie zB SDR um Logitech  Funktastaturen oder </tspan><tspan
         x="51.734375"
         y="342.64141"
         id="tspan26">Funkkopfhörer zu stören
</tspan><tspan
         x="51.734375"
         y="353.30809"
         id="tspan27">
</tspan><tspan
         x="51.734375"
         y="363.97478"
         id="tspan28">•  Vredächtig ist Herr Dominik-Einkaufswagen-Br. welcher </tspan><tspan
         x="51.734375"
         y="374.64147"
         id="tspan29">an der Uni Zürich studiert hat und viel zu früh schon </tspan><tspan
         x="51.734375"
         y="385.30816"
         id="tspan30">wusste was eine SkinnerBox ist
</tspan><tspan
         x="51.734375"
         y="395.97484"
         id="tspan31">
</tspan><tspan
         x="51.734375"
         y="406.64153"
         id="tspan32">• Die Uni Zürich war bereits 1950 WeltELITE in Neurologie </tspan><tspan
         x="51.734375"
         y="417.30822"
         id="tspan33">Forschung, und diese wären allenfalls damals schon </tspan><tspan
         x="51.734375"
         y="427.9749"
         id="tspan34">primär im Interesse von wirtschaftskriminellen </tspan><tspan
         x="51.734375"
         y="438.64159"
         id="tspan35">Geldgebern gewesen
</tspan><tspan
         x="51.734375"
         y="449.30828"
         id="tspan36">
</tspan><tspan
         x="51.734375"
         y="459.97496"
         id="tspan37">Mieter werden so gegeneinander ausgespielt, dass sich die </tspan><tspan
         x="51.734375"
         y="470.64165"
         id="tspan38">&quot;LaborRatten gegenseitig Vernichten&quot; und das wird dann </tspan><tspan
         x="51.734375"
         y="481.30834"
         id="tspan39">esoterisch mit &quot;Karma&quot; und dem &quot;Einen Freud ist des </tspan><tspan
         x="51.734375"
         y="491.97503"
         id="tspan40">Andern Leid&quot; angestiftet. 
</tspan><tspan
         x="51.734375"
         y="502.64171"
         id="tspan41">
</tspan><tspan
