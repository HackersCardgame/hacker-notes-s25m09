    <text
       xml:space="preserve"
       style="font-size:12.0929px;line-height:1.1;font-family:Serif;-inkscape-font-specification:Serif;text-align:center;writing-mode:lr-tb;direction:ltr;text-anchor:middle;fill:#808000;stroke-width:6.04925"
