         sodipodi:role="line"
         id="tspan33"
         style="font-weight:bold;stroke-width:2.69517"
         x="148.47037"
         y="136.83879">MUTMASSLICHES MOTIV und VORGEHEN</tspan></text>
    <text
       xml:space="preserve"
       style="font-size:9.29429px;line-height:1.1;font-family:Serif;-inkscape-font-specification:Serif;text-align:center;writing-mode:lr-tb;direction:ltr;text-anchor:middle;fill:#ff0000;stroke-width:4.64929"
       x="148.60689"
       y="83.833351"
       id="text45"><tspan
         sodipodi:role="line"
         id="tspan13"
         style="fill:#000000;stroke-width:4.64929"
         x="148.60689"
         y="83.833351">Und die Verhaftungen 2013 und 2019 als <tspan
   style="fill:#ff0000"
   id="tspan3">Alkaida-Terrorist</tspan></tspan><tspan
         sodipodi:role="line"
         style="fill:#000000;stroke-width:4.64929"
         x="148.60689"
         y="94.057068"
         id="tspan24">ist rechtlich eine <tspan
   style="font-weight:bold;fill:#ff0000"
   id="tspan22">SUGGESTIV-VERHAFTUNG</tspan>, womit dann</tspan><tspan
         sodipodi:role="line"
         style="fill:#000000;stroke-width:4.64929"
         x="148.60689"
         y="104.28079"
         id="tspan36"><tspan
   style="fill:#808000"
   id="tspan30">FRAGWÜRDIGE NACHBARN</tspan> damit auch noch legitimieren zB</tspan><tspan
         sodipodi:role="line"
         style="font-weight:bold;fill:#000000;stroke-width:4.64929"
         x="148.60689"
         y="114.50451"
         id="tspan45">mein Fahrrad und diverses Anderes zu klauen</tspan></text>
