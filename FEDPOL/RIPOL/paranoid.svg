         x="148.26419"
         y="47.833412"
         id="tspan5">.... <tspan
   style="font-weight:normal"
   id="tspan37">und</tspan> paranoid gehalten</tspan></text>
    <text
       xml:space="preserve"
       style="font-size:9.29429px;line-height:1.1;font-family:Serif;-inkscape-font-specification:Serif;text-align:center;writing-mode:lr-tb;direction:ltr;text-anchor:middle;fill:#ff0000;stroke-width:4.64929"
       x="148.49998"
       y="128.81253"
       id="text6"><tspan
         sodipodi:role="line"
         style="font-weight:bold;fill:#000000;stroke-width:4.64929"
         x="148.49998"
         y="128.81253"
         id="tspan11">&quot;<tspan
   style="fill:#0000ff"
   id="tspan31">WIR WOLLEN NUR <tspan
   style="fill:#ff0000"
   id="tspan32">HELFEN</tspan> einen TERRORISTEN zu fangen</tspan>&quot;</tspan></text>
    <text
       xml:space="preserve"
       style="font-size:5.99723px;line-height:0;font-family:Serif;-inkscape-font-specification:Serif;text-align:center;writing-mode:lr-tb;direction:ltr;text-anchor:middle;fill:#ff0000;stroke-width:3"
       x="148.48801"
       y="148.76364"
       id="text12"><tspan
         sodipodi:role="line"
         id="tspan12"
         style="line-height:1.1;stroke-width:3"
         x="148.48801"
         y="148.76364">Irge<tspan
   style="fill:#000000"
   id="tspan72">ndwelche mächtige Grosskonzerne tragen Zeugen in Terror-Verdächtigen-Datenbanken</tspan></tspan><tspan
         sodipodi:role="line"
         style="line-height:1.1;fill:#000000;stroke-width:3"
         x="148.48801"
         y="155.3606"
         id="tspan14">oder in RIPOL ein um den <tspan
   style="font-weight:bold;fill:#000000"
   id="tspan21">Zeugen</tspan> <tspan
   style="font-weight:bold;fill:#000000"
   id="tspan23">...</tspan></tspan><tspan
         sodipodi:role="line"
         style="line-height:1.1;stroke-width:3"
         x="148.48801"
         y="161.95755"
         id="tspan49" /><tspan
         style="font-size:4.23333px;line-height:0.9;stroke-width:3"
         sodipodi:role="line"
         id="tspan65"
         x="148.48801"
         y="166.65854">In Sachen MORD DURCH PHILIPP Lüscher an 3 ABB Administratoren Zwecks Vorbereitung von </tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;line-height:0.9;stroke-width:3"
         x="148.48801"
         y="170.46852"
         id="tspan19">Wirtschaftsspionage (<tspan
   style="font-weight:bold"
   id="tspan69">CH-Variante der <tspan
   style="fill:#000000"
   id="tspan70">Strategic Mission J, NSA</tspan></tspan>) und Abfluss <tspan
   style="font-weight:bold"
   id="tspan71">EIENR Milliardde</tspan> nach USA</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;line-height:0.9;stroke-width:3"
         x="148.48801"
         y="174.27852"
         id="tspan68" /><tspan
         sodipodi:role="line"
         style="font-weight:bold;line-height:1.1;fill:#000000;stroke-width:3"
         x="148.48801"
         y="179.9845"
         id="tspan20">... zu vernichten, <tspan
   style="font-weight:normal"
   id="tspan74">bzw. als Zeugen für die Vorkommnisse in den Firmennetzwerken der ABB</tspan></tspan></text>
    <text
       xml:space="preserve"
       style="font-size:5.99723px;line-height:1.1;font-family:Serif;-inkscape-font-specification:Serif;text-align:center;writing-mode:lr-tb;direction:ltr;text-anchor:middle;fill:#1a1a1a;stroke-width:3"
       x="148.58395"
       y="57.653572"
       id="text24"><tspan
         sodipodi:role="line"
         style="stroke-width:3"
         x="148.58395"
         y="57.653572"
         id="tspan25"><tspan
   style="font-weight:bold"
   id="tspan38">Jeder</tspan> welcher unschuldig ist und dann gleich 2x von einem 4-köpfiges bewaffnetes</tspan><tspan
         sodipodi:role="line"
         style="stroke-width:3"
         x="148.58395"
         y="64.250526"
         id="tspan26"> Sonderkommando der Kantonspolizei aus dem Bett geholt wird würde paranoid werden</tspan><tspan
         sodipodi:role="line"
         style="stroke-width:3"
         x="148.58395"
         y="70.847481"
         id="tspan40"> (Siehe <tspan
   style="font-weight:bold;fill:#ff0000"
   id="tspan27">Swatting <tspan
   style="font-weight:normal"
   id="tspan41">um Zeugen zu vernichten und psychisch zu verstümmeln</tspan></tspan>)</tspan></text>
    <text
       xml:space="preserve"
       style="font-size:5.38784px;line-height:1.1;font-family:Serif;-inkscape-font-specification:Serif;text-align:center;writing-mode:lr-tb;direction:ltr;text-anchor:middle;fill:#ff0000;stroke-width:2.69517"
       x="148.47037"
