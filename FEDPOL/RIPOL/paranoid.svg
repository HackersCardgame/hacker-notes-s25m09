         x="148.5"
         y="37.823433"
         id="tspan4">... <tspan
   style="font-weight:normal"
   id="tspan35">ich werde </tspan>paranoid gemacht ...</tspan></text>
    <text
       xml:space="preserve"
       style="font-size:12.0929px;line-height:1.1;font-family:Serif;-inkscape-font-specification:Serif;text-align:center;writing-mode:lr-tb;direction:ltr;text-anchor:middle;fill:#0000ff;stroke-width:6.04925"
